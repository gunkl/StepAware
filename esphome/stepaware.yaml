# StepAware - dev-container entry point (esphome compile/upload/logs stepaware.yaml)
#
# The device config is in stepaware_base.yaml. This file adds only what must be relative to
# the top-level YAML: the local components/ folder and StepAware's partition table.
# Home Assistant's ESPHome Device Builder uses ha/stepaware.yaml instead, which pulls the
# same base and components from GitHub. Keep the component lists in both files the same.
#
# Secrets live in esphome/secrets.yaml (gitignored). Template: secrets.yaml.example.

packages:
  base: !include stepaware_base.yaml

esp32:
  # Identical copy of StepAware's partitions.csv (1.5 MB app slots).
  partitions: partitions.csv

external_components:
  - source:
      type: local
      path: components
    components:
      - stepaware
      - stepaware_matrix
      - stepaware_battery
      - stepaware_power
      - stepaware_boot_reset
