# Compile test for packages/ultrasonic_grove.yaml (cannot share a build with the HC-SR04
# package). Build-only: never flash this to the real device.

esphome:
  name: stepaware-test-misc-grove

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

packages:
  ultrasonic: !include packages/ultrasonic_grove.yaml

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
