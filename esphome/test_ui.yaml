# Compile test for the matrix UI parity work (stepaware core + stepaware_matrix).
# Not a device image: build-only check, never flash this to the real device.
#
# Exercises: battery_low / battery_level / sensor_status_pixels on stepaware, the built-in
# HEART / SPINNER / WAVE / ALERT animations, and the restoring brightness number.
esphome:
  name: stepaware-test-ui
  on_boot:
    - priority: -100
      then:
        - delay: 10s
        - stepaware_matrix.start_animation:
            id: led_matrix
            type: HEART
            duration: 3s
        - delay: 4s
        - stepaware_matrix.start_animation:
            type: spinner
            duration: !lambda "return 2000;"
        - delay: 3s
        - stepaware_matrix.start_animation:
            type: WAVE
        - delay: 2s
        - stepaware_matrix.start_animation:
            type: ALERT
            duration: 2s
        - delay: 3s
        # The brightness number follows this (and persists it).
        - stepaware_matrix.set_brightness:
            brightness: 8
        - lambda: |-
            id(stepaware_core).clearDisplay();
            ESP_LOGI("test", "busy=%d", (int) id(stepaware_core).isBusy());

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [stepaware, stepaware_matrix]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

i2c:
  id: i2c_bus
  sda: GPIO7
  scl: GPIO10
  frequency: 100kHz

output:
  - platform: ledc
    id: hazard_led_pwm
    pin: GPIO3

stepaware_matrix:
  id: led_matrix
  address: 0x70
  brightness: 15
  rotation: 0

binary_sensor:
  - platform: gpio
    id: motion_near
    name: "Motion Near"
    device_class: motion
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
  - platform: gpio
    id: motion_far
    name: "Motion Far"
    device_class: motion
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
  - platform: gpio
    id: mode_button
    name: "Mode Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
  # Stand-in for stepaware_power's "Battery Low"
  - platform: template
    id: battery_low_sensor
    name: "Battery Low"
    device_class: battery
    lambda: return id(battery_percent).state < 15.0f;

sensor:
  # Stand-in for the production battery_percent template sensor
  - platform: template
    id: battery_percent
    name: "Battery"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return 55.0f;

stepaware:
  id: stepaware_core
  motion_near: motion_near
  motion_far: motion_far
  button: mode_button
  hazard_led: hazard_led_pwm
  matrix: led_matrix
  battery_low: battery_low_sensor
  battery_level: battery_percent
  sensor_status_pixels: true
  default_mode: Motion

number:
  - platform: stepaware_matrix
    name: "Matrix Brightness"
    restore_value: true

select:
  - platform: stepaware
    mode:
      name: "Operating Mode"

text_sensor:
  - platform: stepaware
    state:
      name: "State"
