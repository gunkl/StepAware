# Compile test for the stepaware_matrix external component (not for the real device).
esphome:
  name: stepaware-test-matrix
  on_boot:
    - priority: -100
      then:
        - stepaware_matrix.set_snake_progress:
            pixels: 32
        - delay: 500ms
        - lambda: |-
            // Exercise the C++ API other components will use.
            using namespace esphome::stepaware_matrix;
            auto *m = id(matrix);
            if (m->isReady() && !m->isAnimating()) {
              m->setSnakeProgress(64);
              m->setBrightness(8);
              m->startAnimation(ANIM_WIFI_CONNECTED, 2000);
            }
            ESP_LOGI("test", "pattern=%d", (int) m->getPattern());
        - delay: 2500ms
        - stepaware_matrix.start_animation:
            type: MOTION_ALERT
            duration: 5s
        - delay: 6s
        - stepaware_matrix.start_animation:
            id: matrix
            type: battery_low
            duration: !lambda "return 2000;"
        - delay: 3s
        - stepaware_matrix.set_brightness:
            brightness: 15
        - stepaware_matrix.stop_animation
        - stepaware_matrix.clear: matrix

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [stepaware_matrix]

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO7
  scl: GPIO10
  frequency: 100kHz

stepaware_matrix:
  id: matrix
  address: 0x70
  brightness: 15
  rotation: 0

number:
  - platform: stepaware_matrix
    name: "Matrix Brightness"
