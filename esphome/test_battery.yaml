# Compile-only test for stepaware_power's battery states + PIR recalibration, together with
# stepaware_battery. NOT for flashing (no stepaware core / matrix; recal can cut the PIR rail).
esphome:
  name: stepaware-test-battery
  friendly_name: StepAware Battery Test

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [stepaware_power, stepaware_battery]

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  on_safe_mode:
    - wifi.enable:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: true
  ap:
    password: !secret fallback_ap_password

captive_portal:

deep_sleep:
  id: deep_sleep_ctl

# Stand-in for the production time setup (homeassistant + sntp fallback).
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

binary_sensor:
  - platform: gpio
    id: pir_near
    name: "PIR Near"
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
  - platform: gpio
    id: pir_far
    name: "PIR Far"
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
  - platform: gpio
    id: mode_button
    name: "Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
  - platform: gpio
    id: usb_power
    name: "USB Power"
    pin:
      number: GPIO6
      mode: INPUT_PULLDOWN
  - platform: homeassistant
    id: stay_awake_ha
    entity_id: input_boolean.stepaware_stay_awake

sensor:
  - platform: stepaware_battery
    id: battery_voltage
    name: "Battery Voltage"
    samples: 8
    update_interval: 60s
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

stepaware_power:
  id: power
  deep_sleep_id: deep_sleep_ctl
  pir_pins: [GPIO1, GPIO4]
  button_pin: GPIO0
  usb_power_pin: GPIO6
  pir_power_pin: GPIO20
  stay_awake: stay_awake_ha
  button_sensor: mode_button
  activity_sensors: [pir_near, pir_far, mode_button]
  last_activity: !lambda return 0;
  default_mode: "Off"
  on_sleep:
    - logger.log: "about to deep sleep"
  battery:
    voltage_sensor: battery_voltage
    low_threshold: 3.3V
    critical_threshold: 3.0V
    hysteresis: 0.1V
    critical_samples: 3
    critical_shutdown: true
    battery_low:
      name: "Battery Low"
      on_press:
        - logger.log: "battery low -> matrix animation would start here"
    battery_critical:
      name: "Battery Critical"
    battery_state:
      name: "Battery State"
  pir_recalibration:
    time_id: ha_time
    window_start: 2
    window_end: 4
    quiescence: 1h
    cooldown: 2h
    power_off_time: 2s
    warmup: 60s
    button:
      name: "Recalibrate PIRs"
    recalibrating:
      name: "PIR Recalibrating"
    on_recalibration_start:
      - logger.log:
          format: "recal start (isRecalibrating=%d)"
          args: [id(power).isRecalibrating()]
    on_recalibration_end:
      - logger.log: "recal end"
  sleep_blocked:
    name: "Sleep Blocked"
  sleep_block_reason:
    name: "Sleep Block Reason"

text_sensor:
  - platform: template
    name: "Battery State (lambda)"
    update_interval: 60s
    lambda: return std::string(id(power).getBatteryStateName());
